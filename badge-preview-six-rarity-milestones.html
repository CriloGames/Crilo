<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crilo — Six Score Milestones</title><style>body{font:16px system-ui;color:#30343c;background:#f9f8f5;margin:32px auto;padding:0 18px;max-width:970px}h1{font-size:26px}p{color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card{border:1px solid #e7e3dc;border-radius:20px;background:white;padding:24px;text-align:center}.card svg{width:110px;height:110px}.card h2{font-size:18px;margin:8px 0}.card small{color:#777}</style><h1>Crilo — Six Rarity-Aligned Score Milestones</h1><p>Actual SVG artwork used by the Crilo profile. Thresholds reflect the first score classified in each tier by the current deterministic simulation.</p><div class="grid" id="grid"></div><script>const customTitleScenes={};</script><script src="badge-art-six-rarity-milestones.js?v=1"></script><script>const rows=[["score_100","First Steps","Common","1"],["score_250","Getting Somewhere","Uncommon","57"],["score_3000","Respectable","Rare","142"],["score_5000","High Roller","Epic","327"],["score_10000","Against the Odds","Legendary","842"],["score_100000","The Chosen One","Mythic","2,350"]];document.getElementById('grid').innerHTML=rows.map(([k,n,t,v])=>'<div class="card"><svg viewBox="0 0 48 48" fill="none" stroke="#30343c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+customTitleScenes[k]+'</svg><h2>'+n+'</h2><small>'+t+' · '+v+' points</small></div>').join('');</script></html>
