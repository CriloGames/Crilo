back"],["wheel_dejavu","Déjà Vu"],["wheel_full_circle","Full Circle"],["wheel_groundhog","Groundhog Day"],["wheel_long_way","The Long Way Around"],["wheel_lucky_seven","Lucky Number Seven"],["wheel_minimalist","The Minimalist"],["wheel_mirror","Mirror Image"],["wheel_no_ducks","All Gas, No Brakes"],["wheel_one_each","One of Each"],["wheel_perfect_match","The Perfect Match"],["wheel_small_beginnings","Small Beginnings"],["wheel_chosen_one","The Chosen One"],["wheel_duck_dynasty","Duck Dynasty"],["wheel_quack_attack","Quack Attack"],["wheel_slow_starter","Slow Starter"],["score_750","Not Bad, Actually"],["score_7500","Okay, Calm Down"],["secret_69","Nice."],["secret_owner","Friends in High Places"],["seq_repeat3","Again. Again. Again."],["seq_special5","Chaos"]];document.getElementById('grid').innerHTML=rows.map(([k,n])=>'<div class="card"><div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="#30343c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+customTitleScenes[k]+'</svg></div><b>'+n+'</b><small>'+k+'</small></div>').join('');</script></html>
