name: Pong Toss last nine scoring checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/solve-pong-toss-targeted.mjs'
      - '.github/workflows/pong-toss-last-nine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate-last-nine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium physics runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local site
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pong-http.log 2>&1 < /dev/null &
          sleep 2
      - name: Targeted 3D scoring-route optimization
        run: node scripts/solve-pong-toss-targeted.mjs
