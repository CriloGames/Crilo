name: Afterimage prototype
on:
  push:
    branches: [main]
    paths: ['afterimage*','test-games.html','scripts/verify-afterimage.mjs','.github/workflows/afterimage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-afterimage.mjs
