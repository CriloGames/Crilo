name: Five Fronts live multiplayer
on:
  pull_request:
    paths:
      - 'five-fronts*'
      - 'supabase/functions/five-fronts-live/**'
      - 'supabase/migrations/*five_fronts*'
      - 'scripts/verify-five-fronts*'
      - '.github/workflows/five-fronts-live.yml'
  push:
    branches: [main]
    paths:
      - 'five-fronts*'
      - 'supabase/functions/five-fronts-live/**'
      - 'supabase/migrations/*five_fronts*'
      - 'scripts/verify-five-fronts*'
      - '.github/workflows/five-fronts-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoritative-multiplayer:
    name: Test human strategy, room security and simultaneous commands
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and rules syntax
        run: |
          node --check five-fronts-core.js
          node --check five-fronts.js
          node --check five-fronts-live.js
      - name: Verify original single player never regresses
        run: node scripts/verify-five-fronts.cjs
      - name: Verify human-only rules and private database contracts
        run: node scripts/verify-five-fronts-live.cjs
      - name: Simulate authenticated live Edge server requests
        run: node scripts/verify-five-fronts-live-server.cjs

  two-browser-rooms:
    name: Check mobile and desktop room gameplay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop + phone invite, battle and reconnect simulation
        run: node scripts/verify-five-fronts-live-browser.mjs
