name: Nothing Here — WebGL startup gate

# Run this fast integration check on pull requests BEFORE merging. A
# parse-only test cannot detect scene-construction exceptions. Push checks
# are still useful for monitoring, but cannot block GitHub Pages if main is
# updated directly. Require this check in main's GitHub branch rules.
on:
  pull_request:
    branches: [main]
    paths:
      - 'secrets.html'
      - 'cube-secrets.js'
      - 'secrets-3d-*.js'
      - 'three-workbench/**'
      - 'scripts/verify-nothing-here-startup.mjs'
      - 'scripts/verify-nothing-here-codes.mjs'
      - '.github/workflows/nothing-here-startup.yml'
  push:
    branches: [main]
    paths:
      - 'secrets.html'
      - 'cube-secrets.js'
      - 'secrets-3d-*.js'
      - 'three-workbench/**'
      - 'scripts/verify-nothing-here-startup.mjs'
      - 'scripts/verify-nothing-here-codes.mjs'
      - '.github/workflows/nothing-here-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothing-here-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgl-startup:
    name: WebGL startup (fresh + saved progress)
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Check source and test syntax
        run: |
          node --check secrets-3d-preview.js
          node --check secrets-3d-finale.js
          node --check secrets-3d-finale-cat.js
          node --check secrets-3d-finale-egg.js
          node --check secrets-3d-finale-duck.js
          node --check secrets-3d-finale-timeline.js
          node --check nothing-here-audio.js
          node --check secrets-3d-details.js
          node --check cube-secrets.js
          node --check scripts/verify-nothing-here-startup.mjs
          node --check scripts/verify-nothing-here-codes.mjs
      - name: Verify maze routes and puzzle structure
        run: node scripts/verify-nothing-here-codes.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the exact proposed site locally
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-here-startup-http.log 2>&1 < /dev/null &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/secrets.html > /dev/null
      - name: Initialize real Three.js cube in Chromium
        run: NOTHING_HERE_SKIP_CASES=finale-saved-mobile,finale-last-discovery node scripts/verify-nothing-here-startup.mjs
      - name: Save screenshots including any failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-startup-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  finale-webgl:
    name: WebGL finale (60/60 + replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Verify completion source and test syntax
        run: |
          node --check secrets-3d-preview.js
          node --check secrets-3d-finale.js
          node --check secrets-3d-finale-cat.js
          node --check secrets-3d-finale-egg.js
          node --check secrets-3d-finale-duck.js
          node --check secrets-3d-finale-timeline.js
          node --check nothing-here-audio.js
          node --check nothing-here-audio.js
          node --check scripts/verify-nothing-here-startup.mjs
          node scripts/verify-nothing-here-codes.mjs
          node scripts/verify-nothing-here-finale-rhythm.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the proposed 3D game
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-here-finale-http.log 2>&1 < /dev/null &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/secrets.html > /dev/null
      - name: Unfold after discovery 60, verify T layout and replay completed saves
        run: NOTHING_HERE_ONLY_CASES=fresh-desktop,finale-saved-mobile,finale-last-discovery node scripts/verify-nothing-here-startup.mjs
      - name: Save finale screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-finale-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  soundtrack-beat-audit:
    name: Actual MP3 beat onset audit
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read tempo phase from licensed soundtrack
        run: python3 scripts/audit-nothing-here-audio-beats.py
