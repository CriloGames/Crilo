name: Wheel upgrade number readability
on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'release/346-badges/155-wheel-upgrade-label-visibility-browser.cjs'
      - '.github/workflows/wheel-upgrade-label-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --check game.js
      - run: node release/346-badges/155-wheel-upgrade-label-visibility-browser.cjs
