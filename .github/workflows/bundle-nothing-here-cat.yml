name: Bundle Nothing Here HD tabby cat model
on:
  push:
    branches: [feature/nothing-here-reference-synced-final-finale]
    paths:
      - '.github/workflows/bundle-nothing-here-cat.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Copy CC0 textured standing tabby into game assets
        run: |
          mkdir -p assets/nothing-here
          curl -fSL --retry 4 --retry-delay 2 \
            'https://cdn.3dassets.dev/assets/28146/v1/model.glb' \
            -o assets/nothing-here/cat-tabby.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/nothing-here/cat-tabby.glb')
          b=p.read_bytes()
          assert 100_000<len(b)<2_000_000,len(b)
          assert b[:4]==b'glTF'
          print('Real high-detail cat model imported:',len(b),'bytes')
          PY
      - name: Commit bundled public-domain 3D model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nothing-here/cat-tabby.glb
          git diff --cached --quiet && exit 0
          git commit -m 'Bundle textured 15k-triangle CC0 grey tabby cat model'
          git push origin HEAD:feature/nothing-here-reference-synced-final-finale
