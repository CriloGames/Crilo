name: Verified guest Daily claim
on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'release/346-badges/038-guest-daily-refresh-lock-smoke.cjs'
      - 'release/346-badges/133-guest-rate-limit-smoke.cjs'
      - 'sql/guest-daily-session-rate-limit-20261013.sql'
      - '.github/workflows/guest-daily-claim.yml'
  workflow_dispatch:
jobs:
  guest-daily-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check client syntax
        run: node --check game.js
      - name: Test server-backed guest spin, reload and sign-in claim
        run: node release/346-badges/038-guest-daily-refresh-lock-smoke.cjs
      - name: Test guest-session server-side throttling and error UI
        run: node release/346-badges/133-guest-rate-limit-smoke.cjs
