name: Nothing Here physical 3D setup

on:
  pull_request:
    branches: [main]
    paths:
      - 'secrets.html'
      - 'cube-secrets.js'
      - 'secrets-3d-*.js'
      - 'three-workbench/**'
      - 'scripts/verify-nothing-here-live-3d.mjs'
      - 'scripts/verify-nothing-here-second-coin.mjs'
      - 'scripts/verify-nothing-here-cat.mjs'
      - 'scripts/verify-nothing-here-finale-rhythm.mjs'
      - 'scripts/verify-nothing-here-final-mile.mjs'
      - '.github/workflows/nothing-here-3d.yml'
  push:
    branches: [main]
    paths:
      - 'three-workbench/**'
      - 'secrets-3d-preview.html'
      - 'secrets-3d-preview.js'
      - 'secrets-3d-finale.js'
      - 'secrets-3d-finale-loaf.js'
      - 'secrets-3d-finale-cat.js'
      - 'secrets-3d-finale-egg.js'
      - 'secrets-3d-finale-timeline.js'
      - 'secrets-3d-details.js'
      - 'secrets-3d-finish.js'
      - 'secrets-3d-batching.js'
      - 'secrets-3d-game-hotspots.js'
      - 'secrets-3d-worlds.js'
      - 'secrets-3d-pickups.js'
      - 'secrets-3d-spatial-qa.js'
      - 'secrets.html'
      - 'cube-secrets.js'
      - 'cube-physical.css'
      - 'scripts/verify-nothing-here-live-3d.mjs'
      - 'scripts/verify-nothing-here-second-coin.mjs'
      - 'scripts/verify-nothing-here-cat.mjs'
      - 'scripts/verify-nothing-here-finale-rhythm.mjs'
      - 'scripts/verify-nothing-here-final-mile.mjs'
      - 'scripts/verify-secrets-3d-preview.mjs'
      - 'scripts/verify-nothing-here-codes.mjs'
      - '.github/workflows/nothing-here-3d.yml'
  workflow_dispatch:

permissions:
  contents: read

# Do not run six resource-intensive Chromium/WebGL renderers against
# intermediate commits while a newer game integration is already queued.
concurrency:
  group: nothing-here-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-and-preview:
    runs-on: ubuntu-24.04
    # End-to-end coin, live WebGL and visual checks exceed 23 minutes on
    # software-rendered Chromium; don't cancel a passing suite mid-run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Install physical 3D dependencies
        working-directory: three-workbench
        run: npm install --no-audit --no-fund
      - name: Verify Three.js, GSAP and BVH installation
        working-directory: three-workbench
        run: npm run check:deps
      - name: Verify WebGL source syntax
        run: |
          node --check cube-secrets.js
          node --check secrets-3d-preview.js
          node --check secrets-3d-finale.js
          node --check secrets-3d-finale-cat.js
          node --check secrets-3d-finale-egg.js
          node --check secrets-3d-finale-duck.js
          node --check secrets-3d-finale-loaf.js
          node --check secrets-3d-finale-timeline.js
          node --check scripts/verify-nothing-here-finale-rhythm.mjs
          node --check secrets-3d-details.js
          node --check secrets-3d-finish.js
          node --check secrets-3d-batching.js
          node --check secrets-3d-game-hotspots.js
          node --check secrets-3d-worlds.js
          node --check secrets-3d-pickups.js
          node --check secrets-3d-spatial-qa.js
          node --check three-workbench/scripts/verify-visual-regression.mjs
          node --check scripts/verify-nothing-here-live-3d.mjs
          node --check scripts/verify-nothing-here-second-coin.mjs
          node --check scripts/verify-nothing-here-cat.mjs
          node --check scripts/verify-nothing-here-final-mile.mjs
          node --check scripts/verify-secrets-3d-preview.mjs
          node --check scripts/verify-nothing-here-codes.mjs
      - name: Verify that every engraved puzzle code actually operates its mechanism
        run: node scripts/verify-nothing-here-codes.mjs
      - name: Verify original track and rhythmic cat finale
        run: node scripts/verify-nothing-here-finale-rhythm.mjs
      - name: Install browser for physical preview
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Serve static GitHub Pages output
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-3d-http.log 2>&1 < /dev/null &
          sleep 2
      # The vending-machine second-coin and all later deliveries have their
      # own shorter browser walkthrough. Report a dead end before rendering
      # the whole six-face visual museum for the full integration suite.
      - name: Verify cat is actually touchable and produces one saved bark
        run: node scripts/verify-nothing-here-cat.mjs
      - name: Verify observatory shutter with isolated real 3D controls
        run: NH_OBSERVATORY_ONLY=1 node scripts/verify-nothing-here-second-coin.mjs
      # Run real playable-game interaction checks first. A failure should not
      # require a three-minute software-rendered museum screenshot beforehand.
      - name: Verify live 60-secret Three.js integration
        run: |
          mkdir -p test-results
          NH_SKIP_DIAGNOSTIC_SCREENSHOTS=1 node scripts/verify-nothing-here-live-3d.mjs
      - name: Save 3D preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-real-3d-previews
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The complete coin/save-recovery walkthrough needs ~22 minutes in
  # software WebGL. Test it on its own runner so failure cannot keep the
  # unlocked 3D geometry tests blocked behind an unrelated long walkthrough.
  coin-recovery-and-story-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Install physical 3D dependencies
        working-directory: three-workbench
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Serve local game
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-3d-http.log 2>&1 < /dev/null &
          sleep 2
      - name: Verify refunded coin, save recovery and downstream puzzle chain
        run: node scripts/verify-nothing-here-second-coin.mjs

  # Independent jobs expose geometry, pixel-rendering and prototype failures
  # in the same run instead of skipping two checks after the first assertion.
  visual-six-face-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Install dependencies for pixel comparisons
        working-directory: three-workbench
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Serve local game
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-3d-http.log 2>&1 < /dev/null &
          sleep 2
      - name: Compare all six faces in locked and unlocked states
        run: node three-workbench/scripts/verify-visual-regression.mjs
      - name: Upload pixel comparison snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-six-face-visual-regression
          path: test-results/nothing-here-visual/
          if-no-files-found: ignore
          retention-days: 7

  prototype-drawer-and-hatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Install physical 3D dependencies
        working-directory: three-workbench
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Serve local game
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-3d-http.log 2>&1 < /dev/null &
          sleep 2
      - name: Verify standalone 3D drawer and hatch controls
        run: |
          mkdir -p test-results
          node scripts/verify-secrets-3d-preview.mjs
      - name: Upload prototype snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-prototype-drawer-preview
          path: test-results/3d-*.png
          if-no-files-found: ignore
          retention-days: 7

  # Runs independently of the full (slow) scene walkthrough. Reproduce
  # late-game elevator, saved-game and 60/60 finale regressions in minutes,
  # without sacrificing the full integration gate required for deployment.
  fast-final-mile:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm and Chromium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nothinghere-pw1561-${{ hashFiles('three-workbench/package.json') }}
      - name: Check fast final-mile test syntax
        run: node --check scripts/verify-nothing-here-final-mile.mjs
      - name: Install headless test browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Serve proposed game
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nh-final-mile-http.log 2>&1 < /dev/null &
          sleep 2
      - name: Verify complete 134.7s reference frame sweep with real WebGL
        run: |
          mkdir -p test-results
          NH_CAPTURE_FINALE_SWEEP=1 node scripts/verify-nothing-here-final-mile.mjs
      - name: Preserve reference-frame screenshots for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-video-reference-3d
          path: |
            test-results/video-reference-*.png
            test-results/egg-*.png
          if-no-files-found: ignore
          retention-days: 7
