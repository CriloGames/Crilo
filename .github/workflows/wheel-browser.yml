name: Crilo Wheel Chromium regression
on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'release/346-badges/086-site-wide-interactions-browser.cjs'
      - 'release/346-badges/087-signed-in-controls-browser.cjs'
      - 'release/346-badges/091-no-signin-flash-browser.cjs'
      - 'moderation.html'
      - 'release/346-badges/078-daily-drawing-storage-chromium.cjs'
      - 'share-result.js'
      - 'official-daily-total.js'
      - 'official-daily-total.css'
      - 'release/346-badges/081-official-daily-total-browser.cjs'
      - 'release/346-badges/085-footer-layout-chromium.cjs'
      - 'legal.css'
      - 'share-result.css'
      - 'public-metrics.js'
      - 'release/346-badges/075-share-growth-browser.cjs'
      - 'privacy.html'
      - 'terms.html'
      - 'legal.css'
      - 'release/346-badges/083-legal-pages-browser.cjs'
      - 'index.html'
      - 'app.js'
      - 'settings.js'
      - 'settings.html'
      - 'friends.js'
      - 'friends.html'
      - 'ducks-page.js'
      - 'ducks.html'
      - 'profile.js'
      - 'profile-avatar.js'
      - 'profile-avatar.css'
      - 'release/346-badges/089-profile-icon-browser.cjs'
      - 'profile.html'
      - 'owner-analytics.js'
      - 'owner-analytics.html'
      - 'leaderboard-tabs.js'
      - 'leaderboard.js'
      - 'leaderboard.html'
      - 'badge-sets.js'
      - 'badge-sets.html'
      - 'support.html'
      - 'shape-of-sound.html'
      - 'sound-shapes.js'
      - 'domain/game.js'
      - 'domain/index.html'
      - 'beetle-tricks.html'
      - 'ducks.js'
      - 'release/346-badges/073-wheel-chromium-browser.cjs'
      - '.github/workflows/wheel-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit all public navigation, tabs, modals, donations and game buttons on mobile and desktop
        run: node release/346-badges/086-site-wide-interactions-browser.cjs
      - name: Verify customizable profile icon save and public display in Chromium
        run: node release/346-badges/089-profile-icon-browser.cjs
      - name: Verify no brief SIGN IN flash while a page restores authentication
        run: node release/346-badges/091-no-signin-flash-browser.cjs
      - name: Test authenticated account settings, Friends, Ducks and owner-only menus without live writes
        run: node release/346-badges/087-signed-in-controls-browser.cjs
      - name: Exercise actual wheel page with synthetic signed-in browser
        run: node release/346-badges/073-wheel-chromium-browser.cjs
      - name: Exercise sharing with real Chromium UI and verified-run fixtures
        run: node release/346-badges/075-share-growth-browser.cjs
      - name: Check footer symmetry and original beetle rail on five viewports
        run: node release/346-badges/085-footer-layout-chromium.cjs
      - name: Render Privacy and Terms on phone tablet and desktop
        run: node release/346-badges/083-legal-pages-browser.cjs
      - name: Verify community count fits phone tablet desktop and updates after save
        run: node release/346-badges/081-official-daily-total-browser.cjs
      - name: Check actual lossless fallback and visually decodable compact drawings
        run: node release/346-badges/078-daily-drawing-storage-chromium.cjs
