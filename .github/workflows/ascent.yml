name: Ascent daily climb
on:
  push:
    branches: [main]
    paths:
      - 'ascent/**'
      - 'scripts/verify-ascent.mjs'
      - '.github/workflows/ascent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ascent-server.log 2>&1 &
          node scripts/verify-ascent.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascent-screens
          path: test-results/ascent
