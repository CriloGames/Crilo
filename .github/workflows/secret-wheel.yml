name: Green Needle secret wheel
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'profile.html'
      - 'secret-wheel.js'
      - 'secret-wheel.css'
      - 'secret-wheel-profile.js'
      - 'secret-wheel-profile.css'
      - 'release/346-badges/124-secret-wheel-smoke.cjs'
      - '.github/workflows/secret-wheel.yml'
  workflow_dispatch:
jobs:
  check-secret-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check secret-wheel.js
          node --check secret-wheel-profile.js
      - name: Check hidden wheel integration
        run: node release/346-badges/124-secret-wheel-smoke.cjs
