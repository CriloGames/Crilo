name: Green Needle secret wheel
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'profile.html'
      - 'settings.html'
      - 'app.js'
      - 'settings.js'
      - 'profile.js'
      - 'leaderboard.js'
      - 'friends.js'
      - 'secret-wheel.js'
      - 'secret-wheel.css'
      - 'secret-wheel-ambient.js'
      - 'secret-wheel-ambient.css'
      - 'secret-name-colors.css'
      - 'release/346-badges/124-secret-wheel-smoke.cjs'
      - 'release/346-badges/125-secret-wheel-browser.cjs'
      - '.github/workflows/secret-wheel.yml'
  workflow_dispatch:
jobs:
  check-secret-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check affected JavaScript syntax
        run: |
          for file in app.js settings.js profile.js leaderboard.js friends.js secret-wheel.js secret-wheel-ambient.js; do node --check "$file"; done
      - name: Check one-spin and reward integration
        run: node release/346-badges/124-secret-wheel-smoke.cjs
  browser-secret-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check layout, interactions, and locked rewards
        run: node release/346-badges/125-secret-wheel-browser.cjs
