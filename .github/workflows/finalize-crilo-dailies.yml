name: Finalize Crilo Daily rankings
on:
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crilo-daily-rank-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Finalize periods older than Crilo's 22:00 UTC reset
        env:
          CI: 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c=fs.readFileSync('supabase-config.js','utf8');
          const url=c.match(/CRILO_SUPABASE_URL\s*=\s*"([^"]+)"/)?.[1];
          const apiKey=c.match(/CRILO_SUPABASE_KEY\s*=\s*"([^"]+)"/)?.[1];
          if(!url||!apiKey)throw new Error('Missing public Supabase configuration');
          const response=await fetch(url+'/rest/v1/rpc/crilo_v3_finalize_periods',{
            method:'POST',
            headers:{apikey:apiKey,Authorization:'Bearer '+apiKey,'Content-Type':'application/json'},
            body:'{}'
          });
          if(!response.ok)throw new Error('Finalize failed: HTTP '+response.status+' '+(await response.text()).slice(0,200));
          const body=await response.text();
          console.log('Crilo rankings finalized. Updated rows: '+body);
          JS
