name: Owner Test Games smoke
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'test-games.html'
      - 'test-games.css'
      - 'test-games.js'
      - 'scripts/verify-test-games.mjs'
      - '.github/workflows/test-games.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'test-games.html'
      - 'test-games.css'
      - 'test-games.js'
      - 'scripts/verify-test-games.mjs'
      - '.github/workflows/test-games.yml'
  workflow_dispatch:
jobs:
  prototype-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-test-games.mjs
