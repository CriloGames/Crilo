name: Package offline nudity detector research dependencies
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nudenet-offline-pack.yml'
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --dest wheelhouse nudenet
      - uses: actions/upload-artifact@v4
        with:
          name: offline-nudenet-wheels
          path: wheelhouse/
          retention-days: 1
