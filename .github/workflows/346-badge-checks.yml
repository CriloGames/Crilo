name: Crilo 346-badge prelaunch checks

on:
  push:
    branches:
      - main
      - release/346-badges-prelaunch
    paths:
      - 'app.js'
      - 'domain/game.js'
      - 'domain/index.html'
      - 'domain/domains.json'
      - 'release/346-badges/043-site-connections-smoke.cjs'
      - 'owner-profile-scores.js'
      - 'badge-events.js'
      - 'support.html'
      - 'friends.js'
      - 'ducks.html'
      - 'friends.html'
      - 'settings.html'
      - 'game.js'
      - 'rarity-system.js'
      - 'profile.js'
      - 'profile.html'
      - 'spin-history.js'
      - 'spin-history.css'
      - 'beetle-tricks.html'
      - 'bug-beetle.js'
      - 'style.css'
      - 'leaderboard.html'
      - 'leaderboard-tabs.js'
      - 'index.html'
      - 'moderation.html'
      - 'moderation-feed.js'
      - 'moderation-feed-scanner.js'
      - 'moderation-scan-worker.js'
      - 'moderation-shape-review.js'
      - 'moderation-genital-review.js'
      - 'moderation-example-features.js'
      - 'moderation-feedback.js'
      - 'badge-collection.js'
      - 'badge-collection.css'
      - 'badge-sets.js'
      - 'badge-sets.html'
      - 'release/346-badges/**'
      - '.github/workflows/346-badge-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app.js'
      - 'domain/game.js'
      - 'domain/index.html'
      - 'domain/domains.json'
      - 'release/346-badges/043-site-connections-smoke.cjs'
      - 'owner-profile-scores.js'
      - 'badge-events.js'
      - 'support.html'
      - 'friends.js'
      - 'ducks.html'
      - 'friends.html'
      - 'settings.html'
      - 'game.js'
      - 'rarity-system.js'
      - 'profile.js'
      - 'profile.html'
      - 'spin-history.js'
      - 'spin-history.css'
      - 'beetle-tricks.html'
      - 'bug-beetle.js'
      - 'style.css'
      - 'leaderboard.html'
      - 'leaderboard-tabs.js'
      - 'index.html'
      - 'moderation.html'
      - 'moderation-feed.js'
      - 'moderation-feed-scanner.js'
      - 'moderation-scan-worker.js'
      - 'moderation-shape-review.js'
      - 'moderation-genital-review.js'
      - 'moderation-example-features.js'
      - 'moderation-feedback.js'
      - 'badge-collection.js'
      - 'badge-collection.css'
      - 'badge-sets.js'
      - 'badge-sets.html'
      - 'release/346-badges/**'
      - '.github/workflows/346-badge-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-client-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          node --check domain/game.js
          node --check friends.js
          node --check badge-events.js
          node --check badge-sets.js
          node --check owner-profile-scores.js
          node --check game.js
          node --check rarity-system.js
          node --check badge-events.js
          node --check profile.js
          node --check leaderboard.js
          node --check badge-collection.js
          node --check badge-sets.js
          node --check spin-history.js
          node --check bug-beetle.js
          node --check leaderboard-tabs.js
          node --check moderation-feed.js
          node --check moderation-feed-scanner.js
          node --check moderation-scan-worker.js
          node --check moderation-shape-review.js
          node --check moderation-genital-review.js
          node --check moderation-example-features.js
          node --check moderation-feedback.js
      - name: Reject fabricated Domain results and unauthorized score or owner edits
        run: node release/346-badges/047-owner-score-security-smoke.cjs
      - name: Audit all page links, friend invites, badge triggers and owner controls
        run: node release/346-badges/043-site-connections-smoke.cjs
      - name: Verify sign-in works on all pages with account headers
        run: node release/346-badges/041-shared-signin-pages-smoke.cjs
      - name: Run official-spin client regression tests
        run: node release/346-badges/009-client-flow-smoke.cjs
      - name: Render all 346 profile badges and earned states
        run: node release/346-badges/012-profile-rendering-smoke.cjs
      - name: Open matching badge details for all 346 badge identities
        run: node release/346-badges/013-clickable-profile-badges-smoke.cjs
      - name: Check earned-only featured badges and rarity colors
        run: node release/346-badges/017-featured-earned-badges-smoke.cjs
      - name: Page official spin history five outcomes at a time
        run: node release/346-badges/014-spin-history-smoke.cjs
      - name: Verify owner Test Run isolation and wheel rarity score HUD
        run: node release/346-badges/016-owner-test-scoreboard-smoke.cjs
      - name: Verify leaderboard rarity layout and clickable beetle sound
        run: node release/346-badges/019-leaderboard-beetle-smoke.cjs
      - name: Verify free owner-local drawing scans and protected moderation controls
        run: node release/346-badges/021-free-drawing-moderation-smoke.cjs
      - name: Verify background QR OCR and nonblocking moderation feed
        run: node release/346-badges/022-drawing-scanner-worker-qa.cjs
      - name: Stress-test thousand-drawing owner backlog with bounded pages
        run: node release/346-badges/032-thousand-drawing-backlog-smoke.cjs
      - name: Verify removed Daily warnings, streak resets and private notifications
        run: node release/346-badges/036-owner-warning-penalty-smoke.cjs
      - name: Verify auth email links, large button and pastel template
        run: node emails/check-templates.cjs
      - name: Verify synchronized final score digit pops and rarity letter wave
        run: node release/346-badges/040-final-rarity-wave-smoke.cjs
      - name: Verify last-spin rarity fanfare and bonus-spin silence
        run: node release/346-badges/039-final-rarity-audio-smoke.cjs
      - name: Verify guest Daily persists after reload and locks second tab
        run: node release/346-badges/038-guest-daily-refresh-lock-smoke.cjs
      - name: Reject owner impersonation and warning without a reason
        run: node release/346-badges/037-owner-warning-permissions-smoke.cjs
      - name: Verify low-memory mobile review opens without automatic AI load
        run: node release/346-badges/034-low-memory-scanner-smoke.cjs
      - name: Detect drawn genital-like outlines and never clear inconclusive images
        run: node release/346-badges/023-outline-safety-review-smoke.cjs
      - name: Verify specialized shape detection and harmless controls
        run: node release/346-badges/024-shape-review-acceptance.cjs
      - name: Catch OCR-misread handwritten website links
        run: node release/346-badges/025-handwritten-link-smoke.cjs
      - name: Verify private example learning and owner action queue updates
        run: node release/346-badges/026-owner-example-learning-smoke.cjs
      - name: Verify OCR on rendered text stress transcriptions
        run: node release/346-badges/031-rendered-ocr-stress.cjs
      - name: Benchmark 100 controlled safe and inappropriate drawings
        env:
          CRILO_QA_STRICT: '1'
          CRILO_QA_REPORT_PATH: release/346-badges/controlled-100-report.json
        run: node release/346-badges/030-controlled-100-drawings.cjs
      - name: Save 100-drawing benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crilo-controlled-100-drawings
          path: release/346-badges/controlled-100-report.json
          if-no-files-found: warn
      - name: Verify Daily reward previews and hidden complex ranking stats
        run: node release/346-badges/027-postdaily-badges-total-points-smoke.cjs
      - name: Verify cumulative points leaderboard and neutral score styling
        run: node release/346-badges/028-lifetime-points-leaderboard-smoke.cjs
      - name: Verify leaderboard tabs never wrap across mobile/tablet/desktop widths
        run: node release/346-badges/020-responsive-leaderboard-tabs-smoke.cjs
      - name: Verify all beetle tricks and normal poop alignment
        run: node release/346-badges/015-beetle-trick-preview-smoke.cjs
      - name: Check active wheel viewport fit and synced beetle droppings
        run: node release/346-badges/018-wheel-viewport-poop-smoke.cjs
      - name: Check 346 normalized badge keys and positive/negative fixtures
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const defs=JSON.parse(fs.readFileSync('release/346-badges/catalog-rules.json'));
          assert.equal(defs.length,346);
          assert.equal(new Set(defs.map(b=>b.key)).size,346);
          assert.equal(new Set(defs.map(b=>b.name)).size,346);
          assert.ok(defs.every(b=>b.rule&&b.condition&&b.rarity));
          const raw=JSON.parse(fs.readFileSync('release/346-badges/006-run-rule-fixtures.json'));
          const runKinds=new Set(['hit_exact','score_band','event_total','event_streak','sequence','challenge','first_event','final_base','spin_position','base_total','base_sequence','number_sequence','first_last','variety']);
          const expected=new Set(defs.filter(b=>runKinds.has(b.rule)).map(b=>b.key));
          assert.equal(expected.size,215);
          assert.ok(Array.isArray(raw.fixtures));
          assert.equal(raw.fixtures.length,215);
          assert.equal(new Set(raw.fixtures.map(b=>b.badge_key)).size,215);
          for(const f of raw.fixtures){
            assert.ok(expected.has(f.badge_key),'Unrecognized run rule fixture '+f.badge_key);
            assert.ok(Array.isArray(f.positive) && f.positive.length>=5,'Missing positive '+f.badge_key);
            assert.ok(Array.isArray(f.negative) && f.negative.length>=5,'Missing negative '+f.badge_key);
          }
          console.log('PASS: 346 unique definitions; 215 positive and negative wheel fixtures.');
          JS
