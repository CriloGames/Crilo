name: Crilo 346-badge prelaunch checks

on:
  push:
    branches:
      - main
      - release/346-badges-prelaunch
    paths:
      - 'game.js'
      - 'rarity-system.js'
      - 'profile.js'
      - 'profile.html'
      - 'spin-history.js'
      - 'spin-history.css'
      - 'beetle-tricks.html'
      - 'bug-beetle.js'
      - 'style.css'
      - 'leaderboard.html'
      - 'leaderboard-tabs.js'
      - 'index.html'
      - 'moderation.html'
      - 'moderation-feed.js'
      - 'moderation-feed-scanner.js'
      - 'moderation-scan-worker.js'
      - 'moderation-shape-review.js'
      - 'badge-collection.js'
      - 'badge-collection.css'
      - 'badge-sets.js'
      - 'badge-sets.html'
      - 'release/346-badges/**'
      - '.github/workflows/346-badge-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'game.js'
      - 'rarity-system.js'
      - 'profile.js'
      - 'profile.html'
      - 'spin-history.js'
      - 'spin-history.css'
      - 'beetle-tricks.html'
      - 'bug-beetle.js'
      - 'style.css'
      - 'leaderboard.html'
      - 'leaderboard-tabs.js'
      - 'index.html'
      - 'moderation.html'
      - 'moderation-feed.js'
      - 'moderation-feed-scanner.js'
      - 'moderation-scan-worker.js'
      - 'moderation-shape-review.js'
      - 'badge-collection.js'
      - 'badge-collection.css'
      - 'badge-sets.js'
      - 'badge-sets.html'
      - 'release/346-badges/**'
      - '.github/workflows/346-badge-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-client-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript syntax
        run: |
          node --check game.js
          node --check rarity-system.js
          node --check badge-events.js
          node --check profile.js
          node --check badge-collection.js
          node --check badge-sets.js
          node --check spin-history.js
          node --check bug-beetle.js
          node --check leaderboard-tabs.js
          node --check moderation-feed.js
          node --check moderation-feed-scanner.js
          node --check moderation-scan-worker.js
          node --check moderation-shape-review.js
      - name: Run official-spin client regression tests
        run: node release/346-badges/009-client-flow-smoke.cjs
      - name: Render all 346 profile badges and earned states
        run: node release/346-badges/012-profile-rendering-smoke.cjs
      - name: Open matching badge details for all 346 badge identities
        run: node release/346-badges/013-clickable-profile-badges-smoke.cjs
      - name: Check earned-only featured badges and rarity colors
        run: node release/346-badges/017-featured-earned-badges-smoke.cjs
      - name: Page official spin history five outcomes at a time
        run: node release/346-badges/014-spin-history-smoke.cjs
      - name: Verify owner Test Run isolation and wheel rarity score HUD
        run: node release/346-badges/016-owner-test-scoreboard-smoke.cjs
      - name: Verify leaderboard rarity layout and clickable beetle sound
        run: node release/346-badges/019-leaderboard-beetle-smoke.cjs
      - name: Verify free owner-local drawing scans and protected moderation controls
        run: node release/346-badges/021-free-drawing-moderation-smoke.cjs
      - name: Verify background QR OCR and nonblocking moderation feed
        run: node release/346-badges/022-drawing-scanner-worker-qa.cjs
      - name: Detect drawn genital-like outlines and never clear inconclusive images
        run: node release/346-badges/023-outline-safety-review-smoke.cjs
      - name: Verify leaderboard tabs never wrap across mobile/tablet/desktop widths
        run: node release/346-badges/020-responsive-leaderboard-tabs-smoke.cjs
      - name: Verify all beetle tricks and normal poop alignment
        run: node release/346-badges/015-beetle-trick-preview-smoke.cjs
      - name: Check active wheel viewport fit and synced beetle droppings
        run: node release/346-badges/018-wheel-viewport-poop-smoke.cjs
      - name: Check 346 normalized badge keys and positive/negative fixtures
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const defs=JSON.parse(fs.readFileSync('release/346-badges/catalog-rules.json'));
          assert.equal(defs.length,346);
          assert.equal(new Set(defs.map(b=>b.key)).size,346);
          assert.equal(new Set(defs.map(b=>b.name)).size,346);
          assert.ok(defs.every(b=>b.rule&&b.condition&&b.rarity));
          const raw=JSON.parse(fs.readFileSync('release/346-badges/006-run-rule-fixtures.json'));
          const runKinds=new Set(['hit_exact','score_band','event_total','event_streak','sequence','challenge','first_event','final_base','spin_position','base_total','base_sequence','number_sequence','first_last','variety']);
          const expected=new Set(defs.filter(b=>runKinds.has(b.rule)).map(b=>b.key));
          assert.equal(expected.size,215);
          assert.ok(Array.isArray(raw.fixtures));
          assert.equal(raw.fixtures.length,215);
          assert.equal(new Set(raw.fixtures.map(b=>b.badge_key)).size,215);
          for(const f of raw.fixtures){
            assert.ok(expected.has(f.badge_key),'Unrecognized run rule fixture '+f.badge_key);
            assert.ok(Array.isArray(f.positive) && f.positive.length>=5,'Missing positive '+f.badge_key);
            assert.ok(Array.isArray(f.negative) && f.negative.length>=5,'Missing negative '+f.badge_key);
          }
          console.log('PASS: 346 unique definitions; 215 positive and negative wheel fixtures.');
          JS
