name: Nothing Here dimensional cube browser QA

on:
  push:
    branches: [main]
    paths:
      - 'secrets.html'
      - 'cube-secrets.js'
      - 'secret-room.js'
      - 'cube-secrets.css'
      - 'cube-motion.css'
      - 'cube-worlds.css'
      - 'cube-inspection.css'
      - 'cube-finish.css'
      - 'cube-hardware-fix.css'
      - 'cube-depth.css'
      - 'secret-room.css'
      - 'scripts/verify-nothing-here.mjs'
      - 'nothing-here-audio.js'
      - 'audio/nothing-here/**'
      - 'NOTHING-HERE-AUDIO-CREDITS.md'
      - 'secrets-3d-preview.js'
      - 'secrets-3d-pickups.js'
      - 'cube-physical.css'
      - '.github/workflows/nothing-here-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cube-walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Serve Crilo locally
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nothing-http.log 2>&1 < /dev/null &
          sleep 2
      - name: Verify single 3D view, preserved saves, retired Classic URLs and retry
        run: node scripts/verify-nothing-here.mjs
      - name: Preserve desktop and mobile snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nothing-here-visual-check
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
