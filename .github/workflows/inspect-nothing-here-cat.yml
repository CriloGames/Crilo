name: Inspect tabby geometry names
on:
  push:
    branches: [feature/nothing-here-accurate-cat-spin-neon-lighting]
    paths: ['.github/workflows/inspect-nothing-here-cat.yml']
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print GLB mesh/node hierarchy
        run: |
          python3 - <<'PY'
          import struct,json
          from pathlib import Path
          p=Path('assets/nothing-here/cat-tabby.glb')
          data=p.read_bytes()
          magic,version,total=struct.unpack_from('<4sII',data,0)
          size,kind=struct.unpack_from('<II',data,12)
          j=json.loads(data[20:20+size].decode('utf8'))
          print('CAT_INSPECT',json.dumps({
           'nodes':[{'i':i,'name':n.get('name'),'mesh':n.get('mesh'),
             'children':n.get('children'),'rotation':n.get('rotation'),
             'translation':n.get('translation'),'scale':n.get('scale')}
            for i,n in enumerate(j.get('nodes',[]))],
           'meshes':[{'i':i,'name':m.get('name'),
             'materials':[z.get('material') for z in m.get('primitives',[])]}
            for i,m in enumerate(j.get('meshes',[]))],
           'materials':[{'i':i,'name':m.get('name'),'pbr':m.get('pbrMetallicRoughness',{})}
            for i,m in enumerate(j.get('materials',[]))],
           'scene':j.get('scene'),'scenes':j.get('scenes',[]),
           'images':[{'name':i.get('name'),'mimeType':i.get('mimeType')}
            for i in j.get('images',[])]
          },separators=(',',':')))
          PY
