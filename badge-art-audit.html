<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Crilo — Badge Art Audit</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#30343c;background:#f8f6f1}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1400px;margin-inline:auto}h1{margin:0 0 8px}p{color:#60636c}header{margin-bottom:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{font:inherit;border:2px solid #30343c;border-radius:10px;background:white;padding:10px 12px}input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:13px}.tile{background:white;border:2px solid #30343c;border-radius:15px;padding:14px;min-height:180px}.symbol{width:72px;height:72px;display:grid;place-items:center;background:#faf7ed;border-radius:13px;margin-bottom:10px}.symbol svg{width:64px;height:64px}.name{font-weight:750;font-size:15px}.description{font-size:12px;line-height:1.4;margin-top:6px;color:#666}.key{font-size:10px;color:#8a8d94;margin-top:9px;overflow-wrap:anywhere}.group{grid-column:1/-1;font-size:19px;font-weight:800;margin:20px 0 0}.error{padding:15px;border:2px solid #d36e65;border-radius:12px;background:#fff0ed}.count{font-weight:700}a{color:#30343c}</style></head><body>
<header><h1>Crilo Badge Art Audit</h1><p>Internal visual review of the <strong>actual SVG scenes used on player profiles</strong>. No account or badge progress is changed. <a href="profile.html">Back to profile</a></p><div class="controls"><input id="search" placeholder="Search badge names, keys, or descriptions" aria-label="Search badges"><select id="category" aria-label="Filter category"><option value="">All categories</option></select></div><div class="count" id="count">Loading badges…</div></header><main class="grid" id="gallery"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=8"></script>
<script>
// Isolated audit page: use the existing profile.js scene data without running profile initialization.
// This page fetches the same source files in their production order and extracts only SVG string values.
(async()=>{const files=["profile.js?v=85","score-art-overrides.js?v=1","badge-art-batch-02.js?v=1","badge-art-upgrade-audit.js?v=1","badge-art-batch-03.js?v=1","badge-art-batch-04.js?v=1","badge-art-batch-05.js?v=1","badge-art-batch-06.js?v=1","badge-art-batch-07.js?v=1","badge-art-batch-08.js?v=1","badge-art-batch-09.js?v=1","badge-art-batch-10.js?v=1","badge-art-batch-11.js?v=1","badge-art-batch-12.js?v=1","badge-art-batch-13.js?v=2","badge-art-final-audit.js?v=1","badge-art-score-250-fix.js?v=2","badge-art-score-rarity-aligned.js?v=1","badge-art-six-rarity-milestones.js?v=2","badge-art-doubles-spins-refresh.js?v=1","badge-art-name-refinements.js?v=4"];
const scenes={};const gallery=document.getElementById("gallery"),counter=document.getElementById("count"),search=document.getElementById("search"),category=document.getElementById("category");
try{
for(const file of files){const response=await fetch(file,{cache:"no-cache"});if(!response.ok)throw Error("Cannot load "+file);const src=await response.text();const marker=file.startsWith("profile.js")?"const customTitleScenes=":"Object.assign(customTitleScenes,";let start=src.indexOf(marker);if(start<0)continue;start=src.indexOf("{",start+marker.length);if(start<0)continue;let depth=0,inString=false,escaped=false,end=-1;for(let i=start;i<src.length;i++){const ch=src[i];if(inString){if(escaped)escaped=false;else if(ch==="\\")escaped=true;else if(ch==='"')inString=false;continue}if(ch==='"'){inString=true;continue}if(ch==="{")depth++;else if(ch==="}"&&--depth===0){end=i+1;break}}if(end<0)throw Error("Unclosed SVG definitions in "+file);const json=src.slice(start,end);let found=0;for(const match of json.matchAll(/["']?([a-z][a-z0-9_]+)["']?\s*:\s*("(?:\\.|[^"\\])*")/g)){try{scenes[match[1]]=JSON.parse(match[2]);found++}catch(e){throw Error("Invalid SVG string for "+match[1]+" in "+file)}}if(!found)throw Error("No SVG entries parsed from "+file)}
const config=typeof CRILO_SUPABASE_URL!=="undefined"&&typeof CRILO_SUPABASE_KEY!=="undefined"?{url:CRILO_SUPABASE_URL,key:CRILO_SUPABASE_KEY}:null;
if(!config)throw Error("Missing public Supabase configuration. This page requires the project's existing public URL and anon key.");
const db=window.supabase.createClient(config.url,config.key);const {data,error}=await db.from("badges").select("badge_key,name,description,category").order("badge_key");if(error)throw error;
const rows=data||[];const categories=[...new Set(rows.map(r=>r.category))].sort();for(const c of categories){const option=document.createElement("option");option.value=c;option.textContent=c.replaceAll("_"," ");category.append(option)}
function render(){const query=search.value.trim().toLowerCase(),cat=category.value;const filtered=rows.filter(r=>(!cat||r.category===cat)&&[r.name,r.description,r.badge_key].some(x=>(x||"").toLowerCase().includes(query)));gallery.replaceChildren();let missing=0;for(const b of filtered){const tile=document.createElement("article");tile.className="tile";const symbol=document.createElement("div");symbol.className="symbol";const art=scenes[b.badge_key];if(art){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 48 48");svg.setAttribute("fill","none");svg.setAttribute("stroke","#30343c");svg.setAttribute("stroke-width","1.7");svg.setAttribute("stroke-linecap","round");svg.setAttribute("stroke-linejoin","round");svg.innerHTML=art;symbol.append(svg)}else{symbol.textContent="Missing SVG";missing++}tile.append(symbol);for(const [className,value] of [["name",b.name],["description",b.description],["key",b.badge_key]]){const d=document.createElement("div");d.className=className;d.textContent=value||"";tile.append(d)}gallery.append(tile)}counter.textContent=filtered.length+" / "+rows.length+" active badges shown"+(missing?" · "+missing+" missing SVGs":"")}
search.addEventListener("input",render);category.addEventListener("change",render);render();
}catch(e){counter.textContent="Could not load badge audit";gallery.innerHTML="";const el=document.createElement("div");el.className="error";el.textContent=e.message;gallery.append(el)}
})();
</script></body></html>
