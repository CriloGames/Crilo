<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crilo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      text-align: center;
      padding: 70px 20px 45px;
    }

    h1 {
      font-size: 64px;
      margin: 0;
      letter-spacing: -3px;
    }

    header p {
      color: #777;
      font-size: 18px;
    }

    main {
      width: min(900px, 90%);
      margin: auto;
    }

    .game {
      background: white;
      border-radius: 20px;
      padding: 35px;
      cursor: pointer;
      transition: transform .2s;
      border: 1px solid #ddd;
    }

    .game:hover {
      transform: translateY(-5px);
    }

    .game h2 {
      font-size: 30px;
      margin: 0 0 10px;
    }

    .game p {
      margin: 0;
      color: #666;
      font-size: 17px;
    }

    .coming {
      margin-top: 30px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <h1>crilo</h1>
    <p>games & other stuff</p>
  </header>

  <main>

    <div class="game">
      <h2>Domain or Garbage?</h2>
      <p>How much did this domain actually sell for?</p>
    </div>

    <div class="coming">
      more coming soon
    </div>

  </main>

</body>
</html>
