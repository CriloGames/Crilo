<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crilo — Doubles and Spins Artwork</title><style>body{font:16px system-ui;color:#30343c;background:#faf9f7;margin:32px auto;padding:0 18px;max-width:1040px}h1{font-size:26px}p{color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px}.card{border:1px solid #e8e4df;border-radius:19px;background:white;padding:19px;text-align:center}.card svg{width:105px;height:105px}.card h2{font-size:16px;margin:10px 0 4px}.card small{color:#777}</style><h1>Crilo — Actual Badge Artwork</h1><p>These are the same SVG strings loaded by the profile. Two score icons and 21 Doubles / Extra Spins icons, each matched to its name.</p><div class="grid" id="grid"></div><script>const customTitleScenes={};</script><script src="badge-art-doubles-spins-refresh.js?v=1"></script><script>const rows=[["score_10000","Against the Odds","842 points"],["score_100000","The Chosen One","2,350 points"],["double_1","Double Trouble","First ×2"],["double_2","Seeing Double","2 ×2"],["double_3","Compound Interest","3 ×2"],["double_4","Exponential-ish","4 ×2"],["double_5","Multiplication Table","5 ×2"],["double_6","Times Two, Again","6 ×2"],["double_back2","Twice in a Row","Consecutive ×2"],["double_back3","Hat Trick","3 consecutive ×2"],["double_zero","Twice Nothing","Double zero"],["double_1000","Worth Doubling","Double 142+"],["double_5000","Now THAT'S a Double","Double 327+"],["double_final","Last Minute Accounting","×2 with one spin left"],["spinplus_1","Not Done Yet","+2 once"],["spinplus_2","Second Wind","+2 twice"],["spinplus_3","Keep Going","+2 three times"],["spinplus_5","No Rush","+2 five times"],["spins_10","Bonus Round","10 total spins"],["spins_15","Marathon","15 total spins"],["spins_20","Can I Go Home Now?","20 total spins"],["spins_25","Why Won't It End?","25 total spins"],["spinplus_saved","Saved by the Bell","+2 on last spin"]];document.getElementById('grid').innerHTML=rows.map(([k,n,d])=>'<div class="card"><svg viewBox="0 0 48 48" fill="none" stroke="#30343c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+customTitleScenes[k]+'</svg><h2>'+n+'</h2><small>'+d+'</small></div>').join('');</script></html>
