<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crilo — Batch 11 badge artwork</title><style>body{font:15px system-ui;background:#f8f7f4;color:#30343c;max-width:1000px;margin:30px auto;padding:20px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.card{background:white;border:1px solid #e4e1dc;border-radius:16px;padding:20px;text-align:center}.icon{width:96px;height:96px;margin:auto auto 12px;background:#faf9f6;border-radius:15px;display:grid;place-items:center}.icon svg{width:88px;height:88px}.card strong{display:block;font-size:14px}.card small{color:#777}p{color:#666}</style><h1>Crilo — Batch 11: Daily Dedication</h1><p>Actual SVGs loaded from the Crilo profile artwork file, enlarged for review. Designed for 48×48.</p><div class="grid" id="grid"></div><script>const customTitleScenes={};</script><script src="badge-art-batch-11.js?v=1"></script><script>const entries=[["runs_50","Frequent Spinner"],["runs_100","Committed"],["runs_250","Veteran"],["runs_500","Wheel Enthusiast"],["runs_1000","Old Timer"]];document.getElementById('grid').innerHTML=entries.map(([key,name])=>'<div class="card"><div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="#30343c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+customTitleScenes[key]+'</svg></div><strong>'+name+'</strong><small>'+key+'</small></div>').join('');</script></html>
